name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string
      skip_reliability_gates:
        description: 'Emergency only: skip reliability gates after recording a reason'
        required: false
        type: boolean
        default: false
      reliability_override_reason:
        description: 'Required when skip_reliability_gates is true'
        required: false
        type: string

# Ensure only one release runs at a time
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  MINISIGN_PUBLIC_KEY: 'RWTQoKUb0Ue4NsqTpPWnABCrIU0+m25zsMlbv6UcRClQ7jmRP3A7NmTB'

permissions:
  contents: read

jobs:
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A manual retry must be dispatched on the requested tag ref; the
          # preflight below proves the event, checkout, and tag resolve alike.
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Manual runs supply the exact tag input and must also select that
          # tag with --ref; tag-push events derive it from GITHUB_REF_NAME.
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          EXPECTED_TAG="v${CARGO_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: release tag must be exactly $EXPECTED_TAG, got $TAG"
            exit 1
          fi
          EXPECTED_REF="refs/tags/${TAG}"
          if [ "$EVENT_REF" != "$EXPECTED_REF" ]; then
            echo "Error: release workflow must run on $EXPECTED_REF, got $EVENT_REF"
            echo "For a manual retry, dispatch the workflow with --ref $TAG"
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ] || [ "$TAG_COMMIT" != "$EVENT_SHA" ]; then
            echo "Error: tag=$TAG_COMMIT checkout=$HEAD_COMMIT event=$EVENT_SHA do not identify one commit"
            exit 1
          fi
          echo "Version and ref checks passed: $CARGO_VERSION ($TAG at $TAG_COMMIT)"

  reliability-gates:
    name: Release Reliability Gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: preflight
    steps:
      - name: Validate reliability override
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_reliability_gates }}
        env:
          RELIABILITY_OVERRIDE_REASON: ${{ inputs.reliability_override_reason }}
        run: |
          set -euo pipefail
          if [ -z "$RELIABILITY_OVERRIDE_REASON" ]; then
            echo "::error::reliability_override_reason is required when skip_reliability_gates is true"
            exit 1
          fi
          {
            echo "## Release Reliability Gates"
            echo ""
            echo "Reliability gates were explicitly skipped for this manual release."
            echo ""
            echo "Reason: $RELIABILITY_OVERRIDE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_reliability_gates }}
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_reliability_gates }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25

      - name: Cache cargo
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_reliability_gates }}
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # upstream snapshot 2026-08-17

      - name: Failure-corpus replay and doctor/recovery postconditions
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_reliability_gates }}
        run: cargo test --locked --test workspace_failure_replay -- --nocapture
        env:
          RUST_LOG: obr=debug

      - name: Crash-injection sync matrix
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_reliability_gates }}
        run: cargo test --locked --test e2e_sync_failure_injection -- --nocapture
        env:
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Long-lived single-workspace stress
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_reliability_gates }}
        run: cargo test --locked --test e2e_workspace_scenarios scenario_long_lived_single_workspace_stress_suite -- --nocapture
        env:
          BR_LONG_STRESS_ITERATIONS: 8
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Concurrent command-family integrity stress
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_reliability_gates }}
        run: cargo test --locked --test e2e_concurrency e2e_interleaved_command_families_preserve_workspace_integrity -- --nocapture
        env:
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Record reliability gate outcome
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.skip_reliability_gates) }}
        run: |
          {
            echo "## Release Reliability Gates"
            echo ""
            echo "Mandatory release reliability gates ran before artifact build:"
            echo "- failure-corpus replay"
            echo "- crash-injection sync matrix"
            echo "- long-lived single-workspace stress"
            echo "- concurrent command-family integrity stress"
            echo "- doctor/recovery postcondition checks"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reliability artifacts
        if: ${{ always() && env.ACT != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_reliability_gates) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-reliability-gate-artifacts
          path: target/test-artifacts/
          if-no-files-found: ignore

  build-release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: reliability-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 (gnu)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            name: linux_amd64
            can_run: true
            linker: ""
          # Linux x64 (musl) — statically linked, no glibc dependency
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            name: linux_musl_amd64
            can_run: true
            linker: ""
          # Linux ARM64 (gnu)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            name: linux_arm64
            can_run: true
            linker: ""
          # Linux ARM64 (musl) — statically linked, no glibc dependency
          # (Alpine Linux on aarch64 needs this; #284)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
            name: linux_musl_arm64
            can_run: true
            linker: ""
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
            name: darwin_amd64
            can_run: true
            linker: ""
          # macOS Apple Silicon (native)
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
            name: darwin_arm64
            can_run: true
            linker: ""
          # Windows x64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            archive: zip
            name: windows_amd64
            can_run: false
            linker: x86_64-w64-mingw32-gcc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Preflight requires both automatic and manual runs to use the exact
          # release tag ref.
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0  # Full history for vergen

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools (for musl targets)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross toolchains
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            sudo apt-get install -y mingw-w64 zip
          fi

      - name: Fix MinGW import library case
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          libkernel32="$(x86_64-w64-mingw32-gcc -print-file-name=libkernel32.a)"
          libdir="$(dirname "$libkernel32")"
          if [ "$libkernel32" = "libkernel32.a" ] || [ ! -f "$libkernel32" ]; then
            echo "Could not locate libkernel32.a"
            exit 1
          fi
          sudo ln -sf "$libkernel32" "$libdir/libKernel32.a"

      - name: Configure cross linker
        if: matrix.linker != ''
        run: |
          case "${{ matrix.target }}" in
            x86_64-pc-windows-gnu)
              echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # upstream snapshot 2026-08-17
        with:
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_BRANCH: ${{ github.ref_name }}

      - name: Verify binary version matches tag
        if: matrix.can_run
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # Manual runs use the required tag input; tag pushes derive the same
          # value from GITHUB_REF_NAME.
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          # Deliberately NOT flattened: the binary reports the true version,
          # build metadata and all. Only asset FILE NAMES flatten `+` (see the
          # "Determine release asset version" step).
          EXPECTED="${TAG#v}"  # strip leading v
          BINARY="obr"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BINARY="obr.exe"
          fi
          RAW=$(./target/${{ matrix.target }}/release/${BINARY} --version 2>&1)
          # clap outputs "obr X.Y.Z"; extract the version token
          ACTUAL=$(echo "$RAW" | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Binary reports version '$ACTUAL' (from '$RAW') but expected '$EXPECTED' (tag: $TAG)"
            exit 1
          fi
          echo "Version check passed: $ACTUAL == $EXPECTED (tag: $TAG)"

      - name: Record cross-build verification strategy
        if: ${{ !matrix.can_run }}
        run: |
          echo "Cross-built target ${{ matrix.target }} cannot be executed on ${{ runner.os }}."
          echo "Relying on tag/Cargo.toml preflight and successful link output instead."

      - name: Determine release asset version
        id: asset_version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          ASSET_VERSION="${TAG#v}"
          # Flatten semver build metadata for FILE NAMES ONLY.
          #
          # obr's version is `0.3.2+1`; the tag keeps that `+` verbatim and
          # so does the binary. Asset file names must not: GitHub's release
          # asset upload API takes the asset name as a URL QUERY parameter,
          # where a literal `+` decodes to a space, and GitHub then stores the
          # space back as `.` — so an uploaded `obr-0.3.2+1-*.tar.gz`
          # lands as `obr-0.3.2.1-*.tar.gz` and every checksum line,
          # `.minisig` name and packaging URL that reconstructs the `+` form
          # points at a file that does not exist.
          # (github/rest-api-description#2968; and see adoptium/temurin*-binaries,
          # which tags `jdk-17.0.9+9.1` yet publishes zero assets containing `+`.)
          #
          # Doing the flattening ourselves — to the same `.` GitHub would have
          # produced — makes the name we generate, the name we upload, the name
          # GitHub stores and the name any downloader reconstructs one string.
          # No `+` ever reaches the upload API, so there is nothing left to
          # rewrite and no encoding behaviour to depend on.
          ASSET_VERSION="${ASSET_VERSION//+/.}"
          echo "asset_version=$ASSET_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release asset version: $ASSET_VERSION (tag: $TAG)"

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        env:
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
        run: |
          cd target/${{ matrix.target }}/release
          cp ../../../LICENSE LICENSE
          tar -czvf "../../../obr-${ASSET_VERSION}-${{ matrix.name }}.tar.gz" obr LICENSE
          cd ../../..

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        env:
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
        run: |
          cd target/${{ matrix.target }}/release
          cp ../../../LICENSE LICENSE
          zip -j "../../../obr-${ASSET_VERSION}-${{ matrix.name }}.zip" obr.exe LICENSE
          cd ../../..

      - name: Install minisign (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Generate checksum (Linux)
        if: runner.os == 'Linux'
        env:
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
        run: |
          asset="obr-${ASSET_VERSION}-${{ matrix.name }}.${{ matrix.archive }}"
          sha256sum "$asset" > "${asset}.sha256"

      - name: Install minisign (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install minisign

      - name: Generate checksum (macOS)
        if: runner.os == 'macOS'
        env:
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
        run: |
          asset="obr-${ASSET_VERSION}-${{ matrix.name }}.${{ matrix.archive }}"
          shasum -a 256 "$asset" > "${asset}.sha256"

      - name: Verify checksum (Linux)
        if: runner.os == 'Linux'
        env:
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
        run: sha256sum -c "obr-${ASSET_VERSION}-${{ matrix.name }}.${{ matrix.archive }}.sha256"

      - name: Verify checksum (macOS)
        if: runner.os == 'macOS'
        env:
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
        run: shasum -a 256 -c "obr-${ASSET_VERSION}-${{ matrix.name }}.${{ matrix.archive }}.sha256"

      - name: Sign archive with Ed25519 (Linux/macOS)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # Ref and tag text reach this shell as DATA, never as source. A git
          # refname may contain `$`, backticks, `;` and quotes, and this is the
          # one step that has the signing key on disk, so interpolating the tag
          # into the script body made a crafted tag command substitution with
          # the release private key in scope.
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
          SIGN_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is required for every release archive"
            exit 1
          fi
          signing_key="$(mktemp "${RUNNER_TEMP:?}/obr-minisign.XXXXXX")"
          trap 'rm -f "$signing_key"' EXIT
          chmod 600 "$signing_key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$signing_key"
          archive="obr-${ASSET_VERSION}-${{ matrix.name }}.${{ matrix.archive }}"
          signature="${archive}.minisig"
          minisign -Sm "$archive" \
            -s "$signing_key" \
            -t "obr $SIGN_REF ${{ matrix.name }}"
          if [ ! -s "$signature" ]; then
            echo "::error::minisign did not produce required signature: $signature"
            exit 1
          fi
          minisign -Vm "$archive" -x "$signature" -P "$MINISIGN_PUBLIC_KEY"

      - name: Upload artifacts
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obr-${{ matrix.name }}
          path: |
            obr-${{ steps.asset_version.outputs.asset_version }}-${{ matrix.name }}.${{ matrix.archive }}
            obr-${{ steps.asset_version.outputs.asset_version }}-${{ matrix.name }}.${{ matrix.archive }}.sha256
            obr-${{ steps.asset_version.outputs.asset_version }}-${{ matrix.name }}.${{ matrix.archive }}.minisig
          retention-days: 7

      - name: Upload artifacts (act)
        if: ${{ env.ACT == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obr-${{ matrix.name }}
          path: |
            obr-${{ steps.asset_version.outputs.asset_version }}-${{ matrix.name }}.${{ matrix.archive }}
            obr-${{ steps.asset_version.outputs.asset_version }}-${{ matrix.name }}.${{ matrix.archive }}.sha256
            obr-${{ steps.asset_version.outputs.asset_version }}-${{ matrix.name }}.${{ matrix.archive }}.minisig
          retention-days: 7

  create-release:
    name: Create Release
    needs: build-release
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write      # Required for SLSA provenance
      attestations: write  # Required for artifact attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Preflight requires this event ref to be the exact release tag so
          # the SBOM, changelog, artifacts, and provenance agree.
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Determine release asset version
        id: asset_version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          ASSET_VERSION="${TAG#v}"
          # Same flattening as the build job, for the same reason: file names
          # never carry semver build metadata's `+`, the tag always does. See
          # the build-release job's copy of this step for the full rationale.
          ASSET_VERSION="${ASSET_VERSION//+/.}"
          echo "asset_version=$ASSET_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release asset version: $ASSET_VERSION (tag: $TAG)"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          pattern: obr-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Validate required artifacts present
        env:
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
        run: |
          MISSING=()
          ARCHIVES=(
            "artifacts/obr-${ASSET_VERSION}-linux_amd64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-linux_musl_amd64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-linux_arm64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-linux_musl_arm64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-darwin_amd64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-darwin_arm64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-windows_amd64.zip"
          )
          for archive in "${ARCHIVES[@]}"; do
            for required_file in "$archive" "${archive}.sha256" "${archive}.minisig"; do
              if [ ! -s "$required_file" ]; then
                MISSING+=("${required_file#artifacts/}")
              fi
            done
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing or empty required release artifacts: ${MISSING[*]}"
            echo "Release cannot proceed without every archive, checksum, and signature."
            for missing_file in "${MISSING[@]}"; do
              echo "Missing or empty: $missing_file"
            done
            exit 1
          fi
          echo "All required release archives, checksums, and signatures are present."

      - name: Install minisign for aggregate verification
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Verify all release signatures
        env:
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
        run: |
          set -euo pipefail
          ARCHIVES=(
            "artifacts/obr-${ASSET_VERSION}-linux_amd64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-linux_musl_amd64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-linux_arm64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-linux_musl_arm64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-darwin_amd64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-darwin_arm64.tar.gz"
            "artifacts/obr-${ASSET_VERSION}-windows_amd64.zip"
          )
          for archive in "${ARCHIVES[@]}"; do
            minisign -Vm "$archive" -x "${archive}.minisig" -P "$MINISIGN_PUBLIC_KEY"
          done

      - name: Generate combined checksums
        run: |
          cd artifacts
          combined_checksums="$(mktemp)"
          find . -maxdepth 1 -type f -name '*.sha256' ! -name checksums.sha256 -print0 \
            | sort -z \
            | xargs -0 cat > "$combined_checksums"
          mv "$combined_checksums" checksums.sha256
          echo "=== Combined checksums ==="
          cat checksums.sha256

      - name: Verify all checksums
        run: |
          cd artifacts
          echo "=== Verifying all checksums ==="
          while IFS= read -r -d '' checksum_file; do
            if [ "$checksum_file" != "./checksums.sha256" ]; then
              echo "Verifying $checksum_file..."
              sha256sum -c "$checksum_file"
            fi
          done < <(find . -maxdepth 1 -type f -name '*.sha256' -print0 | sort -z)

      - name: Generate changelog
        id: changelog
        env:
          RELIABILITY_OVERRIDE_REASON: ${{ inputs.reliability_override_reason }}
          SKIP_RELIABILITY_GATES: ${{ inputs.skip_reliability_gates }}
          ASSET_VERSION: ${{ steps.asset_version.outputs.asset_version }}
          RELEASE_TAG: ${{ steps.asset_version.outputs.release_tag }}
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to ${RELEASE_TAG}"
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
            PREV_TAG_DATE=$(git log -1 --format=%ci "$PREV_TAG" 2>/dev/null | cut -d' ' -f1 || echo "")
          else
            echo "No previous tag found, generating changelog from start"
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD~20..HEAD 2>/dev/null || git log --pretty=format:"- %s (%h)")
            PREV_TAG_DATE=""
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$SKIP_RELIABILITY_GATES" = "true" ]; then
            RELIABILITY_SECTION="## Release Verification

          Reliability gates were explicitly skipped for this manual release.

          Reason: $RELIABILITY_OVERRIDE_REASON

          "
          else
            RELIABILITY_SECTION="## Release Verification

          Release reliability gates completed before artifacts were built:
          failure-corpus replay, crash-injection sync matrix, long-lived single-workspace stress,
          concurrent command-family integrity stress, and doctor/recovery postcondition checks.

          "
          fi

          # Create release notes file
          {
            cat << EOF
          ## What's Changed

          ${BEADS_SECTION}### Commits

          EOF
            echo "$COMMITS"
            cat << EOF

          ${RELIABILITY_SECTION}
          EOF
            cat << 'EOF' | sed -e "s|@ASSET_VERSION@|${ASSET_VERSION}|g" -e "s|@RELEASE_TAG@|${RELEASE_TAG}|g"
          ## Platforms

          | Platform | Architecture | File |
          |----------|--------------|------|
          | Linux | x86_64 (gnu) | `obr-@ASSET_VERSION@-linux_amd64.tar.gz` |
          | Linux | x86_64 (musl, static) | `obr-@ASSET_VERSION@-linux_musl_amd64.tar.gz` |
          | Linux | ARM64 (gnu) | `obr-@ASSET_VERSION@-linux_arm64.tar.gz` |
          | Linux | ARM64 (musl, static) | `obr-@ASSET_VERSION@-linux_musl_arm64.tar.gz` |
          | macOS | x86_64 (Intel) | `obr-@ASSET_VERSION@-darwin_amd64.tar.gz` |
          | macOS | ARM64 (Apple Silicon) | `obr-@ASSET_VERSION@-darwin_arm64.tar.gz` |
          | Windows | x86_64 | `obr-@ASSET_VERSION@-windows_amd64.zip` |

          ## Installation

          ### Quick Install (Recommended)

          ```bash
          curl -fsSL https://raw.githubusercontent.com/jwiegley/obr/main/install.sh | bash
          ```

          ### Cargo Install

          ```bash
          cargo install --git https://github.com/jwiegley/obr.git obr --tag @RELEASE_TAG@ --locked
          ```

          ### Manual Download

          Download the appropriate binary for your platform from the assets below.

          **Verify checksum:**

          ```bash
          # Download checksums.sha256 and your binary
          sha256sum -c checksums.sha256 --ignore-missing
          ```

          **Verify signature (optional):**

          Binaries are signed with Ed25519 using minisign when a signing key is
          configured. Install minisign and verify with the project's published
          public key:

          ```bash
          # Download the .minisig file for your binary
          # Public key: ${{ env.MINISIGN_PUBLIC_KEY }}
          minisign -Vm obr-${ASSET_VERSION}-linux_amd64.tar.gz \
            -P '${{ env.MINISIGN_PUBLIC_KEY }}'
          ```

          ## Full Changelog

          See [CHANGELOG.md](https://github.com/jwiegley/obr/blob/main/CHANGELOG.md) for the complete history.
          EOF
          } > RELEASE_NOTES.md

          echo "=== Generated release notes ==="
          cat RELEASE_NOTES.md

      - name: Install digest-verified Syft
        run: |
          set -euo pipefail
          readonly syft_version="1.42.3"
          readonly syft_archive="syft_${syft_version}_linux_amd64.tar.gz"
          readonly syft_sha256="0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509"
          readonly syft_url="https://github.com/anchore/syft/releases/download/v${syft_version}/${syft_archive}"
          readonly syft_archive_path="${RUNNER_TEMP:?}/${syft_archive}"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output "$syft_archive_path" "$syft_url"
          printf '%s  %s\n' "$syft_sha256" "$syft_archive_path" | sha256sum -c -
          tar -xzf "$syft_archive_path" -C "$RUNNER_TEMP" syft
          test -x "$RUNNER_TEMP/syft"
          "$RUNNER_TEMP/syft" version
          echo "SYFT_BIN=$RUNNER_TEMP/syft" >> "$GITHUB_ENV"

      - name: Generate SBOMs (CycloneDX and SPDX)
        env:
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          "$SYFT_BIN" dir:. \
            -o cyclonedx-json=artifacts/sbom.cdx.json \
            -o spdx-json=artifacts/sbom.spdx.json
          test -s artifacts/sbom.cdx.json
          test -s artifacts/sbom.spdx.json
          jq -e . artifacts/sbom.cdx.json >/dev/null
          jq -e . artifacts/sbom.spdx.json >/dev/null

      - name: Generate SLSA provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            artifacts/obr-${{ steps.asset_version.outputs.asset_version }}-*.tar.gz
            artifacts/obr-${{ steps.asset_version.outputs.asset_version }}-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          name: obr ${{ steps.asset_version.outputs.release_tag }}
          tag_name: ${{ steps.asset_version.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.asset_version.outputs.release_tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/obr-${{ steps.asset_version.outputs.asset_version }}-*.tar.gz
            artifacts/obr-${{ steps.asset_version.outputs.asset_version }}-*.zip
            artifacts/obr-${{ steps.asset_version.outputs.asset_version }}-*.sha256
            artifacts/obr-${{ steps.asset_version.outputs.asset_version }}-*.minisig
            artifacts/checksums.sha256
            artifacts/sbom.cdx.json
            artifacts/sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-crates-io:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}  # Skip pre-releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # cargo publish must build from the tagged source, not the branch HEAD.
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25

      - name: Publish to crates.io
        # `--locked` pins resolution to Cargo.lock; without it, a nightly-only
        # transitive dep bump can silently modify Cargo.lock when cargo fetch
        # runs during `cargo publish`, and the publish then refuses with
        # "files in the working directory contain changes that were not yet
        # committed into git" (seen on v0.1.43).  `--no-verify` skips the
        # rebuild-and-test pass that CI already ran, keeping the publish
        # under the 15-minute timeout and avoiding a second resolution.
        run: cargo publish --locked --no-verify --token ${{ secrets.CRATES_IO_TOKEN }}
