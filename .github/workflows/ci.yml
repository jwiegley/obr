name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
      - name: Runner resource probe (obr-ci-143)
        run: |
          # Diagnostic only; must never fail a job (it already failed three
          # macOS/Windows builds once, which is why the matrix job has none).
          df -h / 2>/dev/null | head -3 || true
          free -m 2>/dev/null | head -3 || true
          nproc 2>/dev/null || true

      - name: Check formatting
        # cargo-fmt binary, not `cargo fmt`: the space form resolves through
        # $CARGO_HOME/bin rustup shims and can run a stale toolchain.
        run: cargo-fmt --all -- --check

      - name: Clippy gate (no new findings vs ci/baseline)
        # Fails only when a lint-kind count exceeds the committed baseline —
        # green on day one over upstream's 85 pre-existing findings, and any
        # new pedantic/nursery finding turns it red. First run on a new OS
        # may require committing that OS's inventory (ci/baseline/README.md).
        run: scripts/lint-gate.sh

      - name: Clippy compile check (no default features)
        # A *compile* check, as the name says, so lints are capped to warn.
        # Without the cap this denied the full pedantic + nursery set in a
        # configuration that has no baseline, over a tree that is knowingly red
        # under those lints — 83 findings, none of them new, and no way for the
        # step to ever pass. Lint regressions are caught by the gate above,
        # which compares against ci/baseline; this step's job is to prove the
        # crate still builds with default features off. A genuine compile error
        # is not a lint and still fails here.
        run: cargo-clippy --all-targets --no-default-features -- --cap-lints=warn

      - name: Check (all targets)
        run: cargo check --all-targets --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2.86.5
        with:
          tool: cargo-audit

      # The advisory scan lives in .github/workflows/audit.yml, where it
      # BLOCKS (D-AUDIT). A second, `continue-on-error: true` copy here
      # asserted nothing and made the advisory posture look enforced twice.
      - name: Check for yanked dependencies
        run: cargo audit --deny yanked

  test:
    name: Test Suite
    env:
      # obr-joz: exit 137 (kernel OOM) during parallel dep compilation of the
      # post-v0.3.2 graph on 16GB runners. Half the rustc parallelism halves
      # peak memory; the first green run warms the cache and mostly retires
      # the cost.
      CARGO_BUILD_JOBS: "2"
    runs-on: ubuntu-latest
    # The full suite never produced a verdict here: one run died at 22.6
    # minutes on the runner's own "No space left on device", the next was
    # cancelled at 45 minutes against a 40-minute cap. This job now runs only
    # the unit tier (`--lib --bins`, measured at ~108 s locally) plus doctests;
    # the full `--all-features` run moved to .github/workflows/nightly.yml.
    #
    # 40, not 25: at 25 this job passed every step and still wore a `cancelled`
    # badge, because it finished in 25 m 01 s. Almost none of that is the tests
    # (2827 of them run in 42 s) — it is two compiles of the whole graph, 12 m
    # 06 s for `--all-features` and 10 m 16 s for `--no-default-features`, which
    # share no artifacts because the feature set differs. The cap has to clear
    # both builds plus a cold cache, or a green run reports as cancelled.
    #
    # WHAT A GREEN TICK ON THIS JOB COVERS, and what it does not (obr-rh0).
    # Covered here: the unit tier (`--lib --bins`, both feature sets) and
    # doctests. NOT covered here: the `tests/*.rs` integration targets, which
    # `--lib --bins` excludes by construction. Those run in
    # .github/workflows/nightly.yml's bare `cargo test --all-features`, except
    # the ones other jobs invoke by name (Quick E2E, Reliability Gates, and
    # doctor.yml's fixture suite).
    #
    # The gap is real and has cost us: chokepoint_db_exec_undo_replay and
    # synthetic_ci_profile_benchmarks_graph_projection_workloads were failing in
    # the nightly, on every push, throughout an effort that took the Doctor job
    # from 60/65 to 65/65 fixtures — and nothing on the push path could see them
    # (obr-oz9). If you add an integration test, know that it is nightly-only
    # unless a named job runs it.
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
      - name: Runner resource probe (obr-ci-143)
        run: |
          # Diagnostic only; must never fail a job (it already failed three
          # macOS/Windows builds once, which is why the matrix job has none).
          df -h / 2>/dev/null | head -3 || true
          free -m 2>/dev/null | head -3 || true
          nproc 2>/dev/null || true

      - name: Unit tests (lib + bins, all features)
        run: |
          set -euo pipefail
          # Informational, in the same idiom as .github/workflows/doctor.yml's
          # health step: the unit tier is knowingly not green (2 baseline
          # failures in ci/baseline/unit-failures-baseline-Darwin.txt, and four
          # doctor tests abort the harness process outright, truncating a
          # parallel run at an unpredictable point — see scripts/unit-gate.sh).
          # HARD FAILURE as of obr-rh0. The comment above described Darwin: the
          # two baseline failures are in `unit-failures-baseline-Darwin.txt`, and
          # the harness aborts there because the default macOS TMPDIR sits under
          # a `/var` symlink that obr refuses as a database route. Neither
          # applies to this runner. Measured green on linux across the runs
          # preceding this change, so the stated precondition ("once the unit
          # tier is clean here") is met and the wrapper is gone.
          #
          # If this turns red on linux, that is the point — do not restore the
          # `|| status=$?`. A tier whose failures are downgraded to a warning
          # cannot be distinguished from a tier that passed.
          cargo test --all-features --lib --bins -- --nocapture
        env:
          RUST_LOG: obr=debug

      - name: Unit tests (no default features)
        run: |
          set -euo pipefail
          cargo test --no-default-features --lib --bins

      - name: Run doc tests
        run: cargo test --doc

  reliability-gates:
    name: Reliability Gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
      - name: Runner resource probe (obr-ci-143)
        run: |
          # Diagnostic only; must never fail a job (it already failed three
          # macOS/Windows builds once, which is why the matrix job has none).
          df -h / 2>/dev/null | head -3 || true
          free -m 2>/dev/null | head -3 || true
          nproc 2>/dev/null || true

      - name: Failure-corpus replay and doctor/recovery postconditions
        run: cargo test --test workspace_failure_replay -- --nocapture
        env:
          RUST_LOG: obr=debug

      - name: Crash-injection sync matrix
        if: always()
        run: cargo test --test e2e_sync_failure_injection -- --nocapture
        env:
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Long-lived single-workspace stress
        if: always()
        run: cargo test --test e2e_workspace_scenarios scenario_long_lived_single_workspace_stress_suite -- --nocapture
        env:
          BR_LONG_STRESS_ITERATIONS: 8
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Concurrent command-family integrity stress
        if: always()
        run: cargo test --test e2e_concurrency e2e_interleaved_command_families_preserve_workspace_integrity -- --nocapture
        env:
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Upload reliability artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reliability-gate-artifacts
          path: target/test-artifacts/
          if-no-files-found: ignore

  audit-gates:
    name: Audit Guardrails (2026-05-09)
    env:
      # obr-joz: exit 137 (kernel OOM) during parallel dep compilation of the
      # post-v0.3.2 graph on 16GB runners. Half the rustc parallelism halves
      # peak memory; the first green run warms the cache and mostly retires
      # the cost.
      CARGO_BUILD_JOBS: "2"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    # Gates added by beads_rust-6jmq for the audit-driven cleanup EPIC
    # (beads_rust-ebzi). Each step corresponds to a sibling bead's harness:
    #   - Snapshot freshness    (l6xl)
    #   - ID-pinning lint       (s5se) — runs as part of `cargo test`
    #   - Forced-cycle-close audit (30ci)
    #   - Sync-safety witness   (yyxo) — Linux only
    #   - Concurrency witness   (mjmk)
    # Documented in docs/TESTING_GUIDELINES.md and the per-bead specs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
      - name: Runner resource probe (obr-ci-143)
        run: |
          # Diagnostic only; must never fail a job (it already failed three
          # macOS/Windows builds once, which is why the matrix job has none).
          df -h / 2>/dev/null | head -3 || true
          free -m 2>/dev/null | head -3 || true
          nproc 2>/dev/null || true

      - name: Install cargo-insta
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2.86.5
        with:
          tool: cargo-insta@1.48.0

      - name: Build release obr binary (used by shell harnesses)
        run: cargo build --release

      # l6xl: snapshot freshness — fails CI on any *.snap.new alongside *.snap
      - name: Snapshot freshness gate (beads_rust-l6xl)
        run: |
          set -euo pipefail
          # Build first. The test run below has its exit status deliberately
          # ignored, so a compile error has to fail here or it would sail
          # straight through the gate.
          cargo test --all-features --no-run \
            --test snapshots \
            --test golden_obr_init \
            --test golden_rich_panels \
            --test storage_golden_snapshot

          # INSTA_UPDATE=new is load-bearing twice:
          #   * cargo-insta forces --check whenever the resolved update mode is
          #     `auto`, and `auto` on a CI runner means "never write .snap.new"
          #     (insta env.rs: Auto + is_ci() -> NoUpdate). Left at the default
          #     this gate would be green by construction.
          #   * with `new`, cargo-insta also sets INSTA_FORCE_PASS=1, so a
          #     drifted snapshot writes its .snap.new and does NOT fail the
          #     assertion. Drift is therefore visible only as a file, which is
          #     what this step's name has always claimed to check.
          # Unrelated failures in these targets are the Test Suite's business,
          # not this gate's, hence `|| true`.
          INSTA_UPDATE=new cargo insta test --all-features \
            --test snapshots \
            --test golden_obr_init \
            --test golden_rich_panels \
            --test storage_golden_snapshot || true

          # No grep: `grep -c` exits 1 on zero matches and would turn a clean
          # tree red under `set -e`. `./target` is pruned because cargo copies
          # snapshot fixtures into it.
          pending="$(find . -path ./target -prune -o -name '*.snap.new' -print)"
          if [ -n "$pending" ]; then
            echo "::error::snapshot drift: pending *.snap.new files (run 'cargo insta review')"
            printf '%s\n' "$pending"
            exit 1
          fi
          echo "snapshot freshness: no pending *.snap.new files"
        env:
          RUST_LOG: error

      # 30ci: regression check that no closed bead has audit-suspect close_reason
      # without an audit-historical-cycle-close-* escape-hatch label
      - name: Audit suspect close_reasons gate (beads_rust-30ci)
        run: |
          set -euo pipefail
          # The script defaults OBR_JSONL to .obr/issues.jsonl. This fork keeps
          # the tracked surface in docs/PLAN.org and `.obr/` is a gitignored
          # per-machine cache, so a fresh checkout has neither the workspace nor
          # a JSONL export and the step failed its own precondition before
          # auditing anything. Rebuild the workspace from the tracked surface —
          # which is exactly what `#+ISSUE_PREFIX:` exists to make possible —
          # and feed the script the records it wants.
          ./target/release/obr init --quiet
          ./target/release/obr sync --import-only
          ./target/release/obr list --status all --json \
            | jq -c '.issues[]' > "${RUNNER_TEMP}/audit-issues.jsonl"
          OBR_JSONL="${RUNNER_TEMP}/audit-issues.jsonl" \
            bash tests/e2e_scripts/forced_cycle_close_audit.sh
        env:
          RUST_LOG: error

      # yyxo: filesystem-witness regression for sync allowlist (PC-1 / PC-RECOVERY)
      - name: Sync safety witness (beads_rust-yyxo)
        run: |
          export OBR_BIN="$(pwd)/target/release/obr"
          bash tests/e2e_scripts/sync_safety_witness.sh

      # mjmk: 50-iter concurrency no-flake harness — readers race writer.
      # Smoke-run 5 iters in CI to keep wall time bounded; full 50-iter
      # is a local pre-merge check.
      - name: Concurrency witness 5-iter smoke (beads_rust-mjmk)
        run: |
          export OBR_BIN="$(pwd)/target/release/obr"
          ITER_OVERRIDE=5 bash tests/e2e_scripts/concurrency_witness_logged.sh

      - name: Upload audit-gate event logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: audit-gate-event-logs
          path: |
            /tmp/sync_safety_witness_*.jsonl
            /tmp/concurrency_witness_*.jsonl
            /tmp/forced_cycle_close_audit_*.summary.txt
          if-no-files-found: ignore

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2.86.5
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          # Linux ARM64 (native runner - 10x faster than QEMU)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          # macOS Apple Silicon (native)
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          # macOS Intel
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary runs (Unix)
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/obr --version

      - name: Verify binary runs (Windows)
        if: runner.os == 'Windows'
        run: ./target/${{ matrix.target }}/release/obr.exe --version

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obr-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/obr

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obr-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/obr.exe

  bench:
    name: Benchmarks
    env:
      # obr-joz: exit 137 (kernel OOM) during parallel dep compilation of the
      # post-v0.3.2 graph on 16GB runners. Half the rustc parallelism halves
      # peak memory; the first green run warms the cache and mostly retires
      # the cost.
      CARGO_BUILD_JOBS: "2"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
      - name: Runner resource probe (obr-ci-143)
        run: |
          # Diagnostic only; must never fail a job (it already failed three
          # macOS/Windows builds once, which is why the matrix job has none).
          df -h / 2>/dev/null | head -3 || true
          free -m 2>/dev/null | head -3 || true
          nproc 2>/dev/null || true

      - name: Restore criterion baseline cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/criterion/
          key: ${{ runner.os }}-${{ runner.arch }}-criterion-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-criterion-

      - name: Snapshot benchmark baseline (if present)
        run: |
          if [ -d target/criterion ]; then
            mkdir -p target/criterion_prev
            cp -a target/criterion/. target/criterion_prev/
          fi

      - name: Run benchmarks
        run: |
          set -euo pipefail
          if find target/criterion -path "*/main/estimates.json" -type f 2>/dev/null | grep -q .; then
            cargo bench --bench storage_perf -- --baseline main --save-baseline main
          else
            cargo bench --bench storage_perf -- --save-baseline main
          fi
        continue-on-error: true

      - name: Check benchmark regressions (5% threshold)
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys

          threshold = 1.05
          prev_root = "target/criterion_prev"
          curr_root = "target/criterion"

          if not os.path.isdir(prev_root):
              print("benchmark_regression: no previous baseline; skipping")
              sys.exit(0)

          prev_files = glob.glob(os.path.join(prev_root, "**", "main", "estimates.json"), recursive=True)
          if not prev_files:
              print("benchmark_regression: no baseline estimates; skipping")
              sys.exit(0)

          regressions = []
          for prev_path in prev_files:
              rel = os.path.relpath(prev_path, prev_root)
              curr_path = os.path.join(curr_root, rel)
              if not os.path.exists(curr_path):
                  continue
              with open(prev_path, "r", encoding="utf-8") as fh:
                  prev = json.load(fh)
              with open(curr_path, "r", encoding="utf-8") as fh:
                  curr = json.load(fh)
              prev_mean = prev.get("mean", {}).get("point_estimate", 0.0)
              curr_mean = curr.get("mean", {}).get("point_estimate", 0.0)
              if prev_mean <= 0:
                  continue
              ratio = curr_mean / prev_mean
              if ratio > threshold:
                  regressions.append((rel, prev_mean, curr_mean, ratio))

          if regressions:
              print("benchmark_regression: failures (mean > 10% slower)")
              for rel, prev_mean, curr_mean, ratio in regressions:
                  print(f"  {rel}: prev={prev_mean:.2f} curr={curr_mean:.2f} ratio={ratio:.2f}")
              sys.exit(1)

          print("benchmark_regression: ok")
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: target/criterion/
          if-no-files-found: ignore

      - name: Save criterion baseline cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/criterion/
          key: ${{ runner.os }}-${{ runner.arch }}-criterion-${{ github.run_id }}

  e2e-quick:
    name: Quick E2E
    env:
      # obr-joz: exit 137 (kernel OOM) during parallel dep compilation of the
      # post-v0.3.2 graph on 16GB runners. Half the rustc parallelism halves
      # peak memory; the first green run warms the cache and mostly retires
      # the cost.
      CARGO_BUILD_JOBS: "2"
    runs-on: ubuntu-latest
    # The cap is for the --release build, not the suite. scripts/e2e.sh now
    # compiles the test binaries before it starts timing (a `timeout` wrapped
    # around `cargo test` was billing the build to E2E_TIMEOUT, which no
    # compile of this tree can fit inside — that is why the first-ever run
    # reported 6 failures in exactly 6 x 180s with no test output). Measured
    # after the fix: the whole suite runs in 83s, longest binary 25s.
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
      - name: Runner resource probe (obr-ci-143)
        run: |
          # Diagnostic only; must never fail a job (it already failed three
          # macOS/Windows builds once, which is why the matrix job has none).
          df -h / 2>/dev/null | head -3 || true
          free -m 2>/dev/null | head -3 || true
          nproc 2>/dev/null || true

      - name: Run quick E2E tests
        run: scripts/e2e.sh
        env:
          NO_COLOR: 1
          HARNESS_ARTIFACTS: 1

      - name: Upload E2E summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-quick-summary
          # The per-binary logs too, not just the summary: the summary carries
          # pass/fail and a duration but never the failing test's NAME, which
          # is the one thing a Linux-only failure needs from CI.
          path: |
            target/test-artifacts/e2e_quick_summary.json
            target/test-artifacts/*.log
          if-no-files-found: ignore
