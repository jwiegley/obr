name: Doctor

# Doctor surface integration (Phase 8 of the world-class-doctor-mode skill).
#
# Runs `obr doctor health --json` against a scratch workspace and
# fails the job if the workspace reports anything non-healthy. Also
# runs `obr doctor capabilities --format json` to lock the contract
# shape and emits a regression-check stub for `scorecard_history.jsonl`.
#
# Action pin policy: every action is sha-pinned (per
# docs/CI_SUPPLY_CHAIN.md) and matches the pin set already used by
# .github/workflows/ci.yml so workflow-fragment harnesses can audit
# them together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: error
  OBR_NO_AUTO_FLUSH: 1

permissions:
  contents: read

jobs:
  doctor-health:
    name: Doctor Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1

      - name: Build obr (release)
        run: cargo build --release

      - name: Doctor health (scratch workspace)
        id: health
        run: |
          set -euo pipefail
          # This repository does track its own issues now (docs/PLAN.org), but
          # `.obr/` is a gitignored per-machine cache, so a fresh checkout has
          # no workspace. Health therefore runs against a freshly initialised
          # scratch one.
          workspace="$(mktemp -d)"
          (cd "$workspace" && "$GITHUB_WORKSPACE/target/release/obr" init --quiet)
          cd "$workspace"
          # `obr doctor health` exits 1 when findings are present
          # (DoctorExitCode::FindingsPresent). Under `set -euo pipefail` that
          # exit propagates through the pipe and kills the step BEFORE the
          # informational `::warning::` branch below has a chance to fire.
          # Tolerate the non-zero exit so the conditional can run; the JSON
          # payload still gets tee'd to /tmp for the uploaded artifact and
          # the downstream `jq` step.
          "$GITHUB_WORKSPACE/target/release/obr" doctor health --json | tee /tmp/doctor_health.json || true
          status="$(jq -r '.status // empty' /tmp/doctor_health.json 2>/dev/null || echo "")"
          echo "status=$status" >>"$GITHUB_OUTPUT"
          if [ "$status" != "healthy" ]; then
            echo "::warning::obr doctor health reported status=$status"
            # Non-healthy is informational on this repo for now; the
            # pre-commit guard blocks at the commit boundary. Once the
            # repo is consistently clean we can flip this to a hard
            # failure via:
            #   exit 1
          fi

      - name: Doctor capabilities (contract sanity)
        run: |
          set -euo pipefail
          ./target/release/obr doctor capabilities --format json | tee /tmp/doctor_caps.json
          # Lock the contract shape: schema_version must match the
          # obr.doctor.capabilities.v1 envelope and every documented
          # exit-code variant must be present.
          jq -e '.schema_version == "obr.doctor.capabilities.v1"' /tmp/doctor_caps.json
          jq -e '(.exit_codes | length) >= 11' /tmp/doctor_caps.json
          jq -e '.ops_supported | length >= 5' /tmp/doctor_caps.json

      - name: Doctor robot-docs (parseable)
        run: |
          set -euo pipefail
          ./target/release/obr doctor robot-docs --format json | tee /tmp/doctor_docs.json
          jq -e '.schema_version == "obr.doctor.robot_docs.v1"' /tmp/doctor_docs.json
          jq -e '.line_count > 20' /tmp/doctor_docs.json

      - name: Doctor --robot-triage (mega-envelope)
        run: |
          set -euo pipefail
          # Needs a workspace, like the health step above. Each `run:` block is
          # its own shell, so that step's `cd` into its scratch workspace does
          # not carry here — this ran in the bare checkout, where `.obr` is
          # gitignored and therefore absent. obr then emitted the `obr_dir`
          # error envelope, which has no `.schema_version`, and the assertion
          # below failed rather than checking anything.
          workspace="$(mktemp -d)"
          (cd "$workspace" && "$GITHUB_WORKSPACE/target/release/obr" init --quiet)
          cd "$workspace"
          "$GITHUB_WORKSPACE/target/release/obr" doctor --robot-triage --json | tee /tmp/doctor_triage.json
          jq -e '.schema_version == "obr.doctor.triage.v1"' /tmp/doctor_triage.json
          jq -e 'has("summary") and has("findings") and has("quick_ref")' /tmp/doctor_triage.json

      - name: Fixture suite (default mode)
        env:
          TOOL_BIN: ${{ github.workspace }}/target/release/obr
          # Report every failure, not just the first. run_all.sh defaults to
          # FAIL_FAST=1, which meant a red job named only the alphabetically
          # first broken fixture: `gitignore_bare_pattern` hid four more for
          # weeks, two of them live product bugs. Every fixture must still pass
          # — this only changes how much the job tells us when one does not.
          FAIL_FAST: "0"
        run: |
          set -euo pipefail
          # Default run_all.sh: corrupt → detect → --repair → post_repair
          # → undo latest → post_undo. Every fixture must pass.
          bash tests/doctor_fixtures/run_all.sh

      - name: Fixture suite (idempotence replay gate, opt-in)
        env:
          TOOL_BIN: ${{ github.workspace }}/target/release/obr
          REPLAY_IDEMPOTENCE: "1"
        run: |
          set -euo pipefail
          # Pass-3: run --repair twice per fixture and assert the
          # second invocation is a no-op (zero non-empty
          # actions.jsonl lines in the new run-dir). Fixtures with
          # .skip_replay markers are honored. Closes the
          # idempotence-replay gap from the pass-2 scorecard.
          bash tests/doctor_fixtures/run_all.sh

      - name: Scorecard regression check
        run: |
          set -euo pipefail
          history=".doctor/runs/scorecard_history.jsonl"
          if [ ! -f "$history" ]; then
            echo "::notice::no scorecard_history.jsonl yet; skipping regression check"
            exit 0
          fi
          # Take the last two scorecard rows and check that no
          # dimension regressed by more than 50 points between them.
          # The skill's diff-scorecards.py lives outside the repo, so
          # the CI step uses jq only.
          tail -n 2 "$history" | jq -s '
            if length < 2 then
              "ok: history too short, no regression to compare"
            else
              .[0].dimensions as $prev
              | .[1].dimensions as $next
              | [
                  $prev | to_entries[] | .key as $k
                  | ($next[$k] // 0) - .value
                ]
              | map(select(. < -50))
              | length
              | if . == 0 then "ok: no regression > 50 pts" else
                  error("regression > 50 pts detected; investigate before merge")
                end
            end
          '

      - name: Upload doctor artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: doctor-envelopes
          path: |
            /tmp/doctor_health.json
            /tmp/doctor_caps.json
            /tmp/doctor_docs.json
            /tmp/doctor_triage.json
          retention-days: 7
